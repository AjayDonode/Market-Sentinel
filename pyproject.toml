[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sentinel"
version = "0.1.0"
description = "Track US sectors and suggest stocks from leading sectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.50",
  "tabulate>=0.9.0",
  "lxml>=5.2.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "alpaca-py>=0.30.0",
  "pytz>=2024.1",
  "streamlit>=1.35.0",
  "plotly>=5.22.0",
]

[project.scripts]
market-sentinel = "market_sentinel.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
